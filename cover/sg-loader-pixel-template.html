<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾光 · 加载（像素归位版）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:
      radial-gradient(70% 58% at 50% 32%,rgba(214,150,58,.13),transparent 64%),
      radial-gradient(120% 90% at 50% 42%,#241a12 0%,#171009 55%,#0f0a06 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--serif,"Noto Serif SC"),"Songti SC","STSong",serif;
    -webkit-font-smoothing:antialiased}

  .wrap{position:relative;width:min(88vw,430px);display:flex;flex-direction:column;
    align-items:center;gap:24px}

  /* ===== 相纸面板 ===== */
  .panel{position:relative;width:100%;aspect-ratio:3/2;background:#F2E9D8;border-radius:2px;
    overflow:hidden;transform:rotate(-.45deg);
    box-shadow:0 30px 64px rgba(0,0,0,.62),0 0 0 1px rgba(70,52,32,.24),
      inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 60px rgba(120,92,58,.16)}
  .panel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* 技术网格 */
  .grid{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:
      linear-gradient(rgba(96,74,48,.11) 1px,transparent 1px),
      linear-gradient(90deg,rgba(96,74,48,.11) 1px,transparent 1px);
    background-size:22px 22px}

  /* 顶部激光进度线 */
  .laser{position:absolute;left:0;top:0;height:3px;width:0;
    background:linear-gradient(90deg,#B9772A,#F6DCAA);
    box-shadow:0 0 12px rgba(246,200,130,.95);pointer-events:none}

  /* 四角十字标 */
  .cross{position:absolute;width:11px;height:11px;pointer-events:none;opacity:.5}
  .cross::before,.cross::after{content:"";position:absolute;background:#5b452c}
  .cross::before{left:0;top:5px;width:11px;height:1px}
  .cross::after{left:5px;top:0;height:11px;width:1px}
  .cross.tl{left:9px;top:9px}
  .cross.tr{right:9px;top:9px}
  .cross.bl{left:9px;bottom:9px}
  .cross.br{right:9px;bottom:9px}

  /* 面板内小标注 */
  .tag{position:absolute;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:8.5px;letter-spacing:.16em;color:rgba(72,54,34,.55);text-transform:uppercase;
    pointer-events:none}
  .tag.tl{left:26px;top:11px}
  .tag.tr{right:26px;top:11px}

  /* 巨号计数器 */
  .count{position:absolute;right:16px;bottom:2px;pointer-events:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:46px;line-height:1;letter-spacing:-.04em;font-weight:500;
    color:rgba(58,42,26,.32);font-variant-numeric:tabular-nums}

  /* ===== 品牌区 ===== */
  .brand{display:flex;align-items:baseline;gap:13px;opacity:0;transform:translateY(7px);
    transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .brand.on{opacity:1;transform:translateY(0)}
  .brand b{font-size:29px;font-weight:700;letter-spacing:.4em;text-indent:.4em;color:#F3E9D8}
  .brand em{font-style:normal;font-size:10.5px;letter-spacing:.46em;color:#9A8465}
  .status{margin-top:-8px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:9.5px;letter-spacing:.2em;color:#866F52;height:12px}

  /* 覆盖层 */
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:5;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.8"/></svg>')}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(120% 100% at 50% 44%,transparent 56%,rgba(10,7,4,.66) 100%)}

  @media (prefers-reduced-motion:reduce){
    .brand{transition:none;opacity:1;transform:none}
    .panel{transform:none}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="panel" id="panel">
    <canvas id="cv"></canvas>
    <div class="grid"></div>
    <div class="laser" id="laser"></div>
    <i class="cross tl"></i><i class="cross tr"></i><i class="cross bl"></i><i class="cross br"></i>
    <div class="tag tl">Nº 0781 · 35mm</div>
    <div class="tag tr">ROLL 04 / 12</div>
    <div class="count" id="count">00</div>
  </div>

  <div class="brand" id="brand"><b>拾光</b><em>家的记忆馆</em></div>
  <p class="status" id="status">正在归位记忆碎片</p>
</div>

<div class="vignette"></div>
<div class="grain"></div>

<script>
(function(){
  var panel=document.getElementById('panel'), cv=document.getElementById('cv'),
      ctx=cv.getContext('2d'), countEl=document.getElementById('count'),
      statusEl=document.getElementById('status'), brand=document.getElementById('brand'),
      laser=document.getElementById('laser');

  var OLD='{{OLD}}', NEW='{{NEW}}';
  var imgOld=new Image(), imgNew=new Image(), got=0;

  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  var step=5, cols=0, rows=0, N=0;
  var TX,TY,SX,SY,DL,WD,OR,OG,OB,NR,NG,NB;

  var T={asm:0.22,asmSpan:1.55,lock:0.5,col:1.95,colSpan:0.82,res:2.95,resDur:0.72};
  var t0=0, lastStatus='';

  function clamp(v,a,b){return v<a?a:(v>b?b:v)}
  function ease(x){return 1-Math.pow(1-x,3)}

  function build(){
    var r=panel.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    step = W<400 ? 6 : 5;
    cols=Math.max(2,Math.floor(W/step));
    rows=Math.max(2,Math.floor(H/step));
    N=cols*rows;

    var tc=document.createElement('canvas'); tc.width=cols; tc.height=rows;
    var tctx=tc.getContext('2d');
    tctx.imageSmoothingEnabled=true;
    tctx.drawImage(imgOld,0,0,cols,rows);
    var dOld=tctx.getImageData(0,0,cols,rows).data;

    tctx.clearRect(0,0,cols,rows);
    tctx.drawImage(imgNew,0,0,cols,rows);
    var dNew=tctx.getImageData(0,0,cols,rows).data;

    TX=new Float32Array(N); TY=new Float32Array(N);
    SX=new Float32Array(N); SY=new Float32Array(N);
    DL=new Float32Array(N); WD=new Float32Array(N);
    OR=new Float32Array(N); OG=new Float32Array(N); OB=new Float32Array(N);
    NR=new Float32Array(N); NG=new Float32Array(N); NB=new Float32Array(N);

    var gx=W*0.30, gy=H*0.58, maxD=Math.hypot(Math.max(gx,W-gx),Math.max(gy,H-gy));
    var i=0;
    for(var ry=0;ry<rows;ry++){
      for(var cx=0;cx<cols;cx++,i++){
        var o=(ry*cols+cx)*4;
        TX[i]=cx*step+step*0.5;
        TY[i]=ry*step+step*0.5;
        var ang=Math.random()*Math.PI*2, rad=24+Math.random()*76;
        SX[i]=Math.cos(ang)*rad; SY[i]=Math.sin(ang)*rad;
        DL[i]=T.asm + ((cx/cols)*0.58+(ry/rows)*0.42)*T.asmSpan + Math.random()*0.12;
        WD[i]=Math.hypot(TX[i]-gx,TY[i]-gy)/maxD*T.colSpan;
        OR[i]=dOld[o]; OG[i]=dOld[o+1]; OB[i]=dOld[o+2];
        NR[i]=dNew[o]; NG[i]=dNew[o+1]; NB[i]=dNew[o+2];
      }
    }
  }

  function drawAt(t){
    ctx.clearRect(0,0,W,H);
    var s=step*0.84, half=s/2;
    for(var i=0;i<N;i++){
      var a=(t-DL[i])/T.lock;
      if(a<=0) continue;
      if(a>1) a=1;
      var e=ease(a);
      var x=TX[i]+SX[i]*(1-e), y=TY[i]+SY[i]*(1-e);
      var cm=clamp((t-(T.col+WD[i]))/T.colSpan,0,1);
      cm=ease(cm);
      var rr=OR[i]+(NR[i]-OR[i])*cm, gg=OG[i]+(NG[i]-OG[i])*cm, bb=OB[i]+(NB[i]-OB[i])*cm;
      ctx.fillStyle='rgba('+(rr|0)+','+(gg|0)+','+(bb|0)+','+(0.12+0.88*a).toFixed(2)+')';
      ctx.fillRect(x-half,y-half,s,s);
    }
    var rv=clamp((t-T.res)/T.resDur,0,1);
    if(rv>0){
      ctx.globalAlpha=ease(rv);
      ctx.drawImage(imgNew,0,0,W,H);
      ctx.globalAlpha=1;
    }
  }

  function renderAt(t){
    drawAt(t);
    var cp=clamp((t-0.25)/1.95,0,1), pct=Math.round(cp*100);
    countEl.textContent=(pct<10?'0':'')+pct;
    laser.style.width=(cp*100).toFixed(1)+'%';
    var st = t<T.col ? '正在归位记忆碎片 · '+Math.round(clamp(t/T.col,0,1)*N).toLocaleString()+' 块'
           : (t<T.res ? '正在上色 · 记忆一点点回来' : '一九七八 · 外婆家门口');
    if(st!==lastStatus){ statusEl.textContent=st; lastStatus=st; }
    if(t>2.55) brand.classList.add('on');
  }

  function tick(now){
    if(!t0) t0=now;
    renderAt((now-t0)/1000);
    if((now-t0)/1000<6.4) requestAnimationFrame(tick);
  }

  function start(){
    build();
    var m=location.search.match(/[?&]t=([\d.]+)/);
    if(m){ renderAt(parseFloat(m[1])); return; }   /* 调试：单帧渲染 */
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
      drawAt(99); countEl.textContent='100'; laser.style.width='100%';
      statusEl.textContent='一九七八 · 外婆家门口'; brand.classList.add('on');
      return;
    }
    requestAnimationFrame(tick);
  }

  function onload(){
    if(++got<2) return;
    start();
  }
  imgOld.onload=onload; imgNew.onload=onload;
  imgOld.onerror=function(){got++;onload()}; imgNew.onerror=function(){got++;onload()};
  imgOld.src=OLD; imgNew.src=NEW;
})();
</script>
</body>
</html>
