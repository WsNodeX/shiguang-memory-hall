<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾光 · 加载（排版电影感）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:
      radial-gradient(64% 46% at 50% 40%,rgba(196,132,42,.10),transparent 68%),
      radial-gradient(120% 100% at 50% 50%,#1b130b 0%,#120c07 60%,#0a0603 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--serif,"Noto Serif SC"),"Songti SC","STSong",serif;
    -webkit-font-smoothing:antialiased}

  .stage{position:relative;width:min(90vw,520px);padding:0 6px;
    display:flex;flex-direction:column;align-items:center;text-align:center}

  .meta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;
    letter-spacing:.28em;color:#7E6748;margin-bottom:26px;height:11px}
  .meta span{display:inline-block}

  .ln{display:block;font-size:clamp(30px,8.4vw,40px);font-weight:700;line-height:1.42;
    letter-spacing:.1em;color:#F2E7D4}
  .ln i{display:inline-block;font-style:normal;will-change:transform,opacity,filter}
  .ln.kai i{font-family:var(--kai,"Kaiti SC"),"STKaiti","楷体",serif;color:#E4C089}

  .sub{margin-top:20px;font-size:13px;letter-spacing:.24em;color:#A98D63;height:20px}
  .sub i{display:inline-block;font-style:normal;will-change:transform,opacity}

  .rule{height:1px;width:0;background:linear-gradient(90deg,transparent,#C9973F,transparent);
    margin:30px 0 0}

  .logo{margin-top:34px}
  .logo b{display:inline-block;font-size:34px;font-weight:700;color:#F6EDDD;will-change:letter-spacing}
  .logo em{display:block;margin-top:12px;font-style:normal;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.3em;
    color:#8C7250;opacity:0}

  .bar{position:fixed;left:0;bottom:0;height:1px;width:0;
    background:linear-gradient(90deg,rgba(201,151,63,0),#D8A65A);
    box-shadow:0 0 8px rgba(216,166,90,.6)}

  .grain{position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:5;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.8"/></svg>')}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(112% 96% at 50% 46%,transparent 54%,rgba(8,5,3,.78) 100%)}
</style>
</head>
<body>
<div class="stage">
  <p class="meta" id="meta"><span>1962 — 2026 · 一个家庭的相册</span></p>

  <p class="ln" id="l1">有些照片</p>
  <p class="ln kai" id="l2">正在褪色</p>

  <p class="sub" id="sub">我们把它，一寸一寸拾回来</p>
  <div class="rule" id="rule"></div>

  <div class="logo">
    <b id="word">拾光</b>
    <em id="sub2">家的记忆馆</em>
  </div>
</div>
<div class="bar" id="bar"></div>
<div class="vignette"></div>
<div class="grain"></div>

<script>
(function(){
  var meta=document.getElementById('meta'), l1=document.getElementById('l1'),
      l2=document.getElementById('l2'), sub=document.getElementById('sub'),
      rule=document.getElementById('rule'), word=document.getElementById('word'),
      sub2=document.getElementById('sub2'), bar=document.getElementById('bar');

  var chars=[];   /* {el, d} */

  function split(el, start, step){
    var txt=el.textContent; el.textContent='';
    for(var i=0;i<txt.length;i++){
      var s=document.createElement('i');
      s.textContent=txt[i];
      el.appendChild(s);
      chars.push({el:s, d:start+i*step});
    }
  }

  function build(){
    split(l1,0.22,0.075);
    split(l2,0.72,0.085);
    split(sub,1.85,0.045);
  }

  function ease(x){return 1-Math.pow(1-x,3)}
  function clamp(v,a,b){return v<a?a:(v>b?b:v)}

  function renderAt(t){
    /* 元信息 */
    var mp=clamp((t-0.05)/0.6,0,1);
    meta.style.opacity=mp;

    /* 逐字：模糊上浮 */
    for(var i=0;i<chars.length;i++){
      var c=chars[i], p=ease(clamp((t-c.d)/0.78,0,1));
      var st=c.el.style;
      st.opacity=p.toFixed(3);
      st.transform='translateY('+((1-p)*26).toFixed(2)+'px) scale('+(0.985+0.015*p).toFixed(3)+')';
      st.filter='blur('+((1-p)*9).toFixed(2)+'px)';
    }

    /* 分隔线 */
    var rp=ease(clamp((t-2.35)/0.85,0,1));
    rule.style.width=(rp*132).toFixed(1)+'px';
    rule.style.opacity=rp.toFixed(2);

    /* 拾光：字距收拢 */
    var wp=ease(clamp((t-2.95)/1.05,0,1));
    word.style.letterSpacing=(0.62-0.34*wp).toFixed(3)+'em';
    word.style.opacity=wp.toFixed(3);
    word.style.filter='blur('+((1-wp)*7).toFixed(2)+'px)';

    var s2p=clamp((t-3.55)/0.9,0,1);
    sub2.style.opacity=s2p.toFixed(3);

    /* 底部进度 */
    bar.style.width=(clamp(t/4.1,0,1)*100).toFixed(1)+'%';
  }

  var t0=0;
  function tick(now){
    if(!t0) t0=now;
    renderAt((now-t0)/1000);
    requestAnimationFrame(tick);
  }

  function start(){
    build();
    var m=location.search.match(/[?&]t=([\d.]+)/);
    if(m){ renderAt(parseFloat(m[1])); return; }
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
      renderAt(99); return;
    }
    requestAnimationFrame(tick);
  }
  start();
})();
</script>
</body>
</html>
