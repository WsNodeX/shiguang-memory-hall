<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾光 · 加载（横向过片灯箱版 · Shadow DOM 隔离）</title>
<style>
  /* 仅作用于唯一宿主元素 #sgLoader，class/id 均唯一，绝不与站点样式冲突 */
  #sgLoader{position:fixed;inset:0;width:100%;height:100%;z-index:2147483000;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--serif,"Noto Serif SC"),"Songti SC","STSong",serif;
    background:
      radial-gradient(70% 50% at 50% 48%,rgba(255,190,110,.09),transparent 66%),
      radial-gradient(110% 90% at 50% 46%,#1a1209 0%,#100b06 58%,#080503 100%);
    transition:opacity .7s ease}
  #sgLoader.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!-- 开场 Loader：灯箱里的旧照逐张恢复颜色。宿主 div 由下方脚本注入 Shadow DOM，站点样式无法穿透 -->
<div id="sgLoader"></div>
<script>
(function(){
  var SRC={{FRAMES}};
  var YEARS={{YEARS}};
  var host=document.getElementById('sgLoader');
  if(!host || !host.attachShadow){ return; }   /* 旧浏览器兜底：不显示 loader 也不影响站点 */
  var root=host.attachShadow({mode:'open'});

  /* ===== 全部 loader 样式与结构都关在 Shadow Root 内，站点 CSS 一律碰不到 ===== */
  root.innerHTML=
    '<style>'+
    '*{margin:0;padding:0;box-sizing:border-box}'+
    '.sg-stage{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(26px,6vh,54px);padding:6vh 0}'+
    '.sg-hd{text-align:center}'+
    '.sg-meta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.26em;color:#7C6446;margin:0 0 16px}'+
    '.sg-hd h1{font-size:clamp(26px,7.4vw,34px);font-weight:700;letter-spacing:.44em;text-indent:.44em;color:#F5EBDA;text-shadow:0 2px 22px rgba(8,5,2,.8);margin:0}'+
    '.sg-hd h1 span{display:block;margin-top:11px;font-size:10px;font-weight:400;letter-spacing:.42em;text-indent:.42em;color:#9C8563}'+
    '.sg-belt{position:relative;width:100%;height:191px;overflow:hidden;background:linear-gradient(180deg,#191209,#0d0804 46%,#0a0603);box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,220,170,.06)}'+
    '.sg-holes{position:absolute;left:0;right:0;height:12px;z-index:3;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(226,206,168,.85) 9px 21px,transparent 21px 30px);opacity:.5}'+
    '.sg-holes.sg-top{top:11px}.sg-holes.sg-bot{bottom:11px}'+
    '.sg-track{position:absolute;left:0;top:22px;display:flex;gap:16px;will-change:transform}'+
    '.sg-frame{position:relative;flex:0 0 auto;width:196px;height:147px;overflow:hidden;background:#0a0704;box-shadow:0 0 0 1px rgba(255,216,168,.14)}'+
    '.sg-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}'+
    '.sg-frame img.sg-clr{opacity:1;will-change:clip-path}'+
    '.sg-frame img.sg-base{filter:sepia(.85) saturate(.4) contrast(.9) brightness(.93)}'+
    '.sg-frame::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(62% 104% at 50% 50%,rgba(255,224,168,var(--hot,0)),transparent 72%);mix-blend-mode:screen}'+
    '.sg-yr{position:absolute;left:6px;bottom:3px;z-index:3;font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.14em;color:rgba(255,236,206,.82);text-shadow:0 1px 4px rgba(0,0,0,.9)}'+
    '.sg-halo{position:absolute;left:50%;top:-40px;bottom:-40px;width:340px;margin-left:-170px;z-index:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(50% 100% at 50%50%,rgba(255,196,120,.34),transparent 74%)}'+
    '.sg-gate{position:absolute;left:50%;top:0;bottom:0;width:190px;margin-left:-95px;z-index:5;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(46% 100% at 50% 50%,rgba(255,244,224,.5),rgba(255,214,150,.16) 62%,transparent 78%)}'+
    '.sg-gate .sg-slit{position:absolute;left:50%;top:-8px;bottom:-8px;width:3px;margin-left:-1.5px;background:linear-gradient(180deg,rgba(255,252,240,0),#FFF8E4 12%,#FFF8E4 88%,rgba(255,252,240,0));box-shadow:0 0 16px 4px rgba(255,238,196,.95),0 0 44px 14px rgba(255,208,130,.55)}'+
    '.sg-gate::before,.sg-gate::after{content:"";position:absolute;top:-6px;bottom:-6px;width:1px;background:linear-gradient(180deg,transparent,rgba(255,220,170,.4),transparent)}'+
    '.sg-gate::before{left:14px}.sg-gate::after{right:14px}'+
    '.sg-ft{display:flex;flex-direction:column;align-items:center;gap:13px;padding:0}'+
    '.sg-tip{font-size:12px;letter-spacing:.2em;color:#A98D66;margin:0}'+
    '.sg-pgw{width:168px;height:1px;background:rgba(120,96,64,.4);overflow:hidden}'+
    '.sg-pgw i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(201,151,63,.2),#E8BE7C);box-shadow:0 0 8px rgba(232,190,124,.7)}'+
    '.sg-pct{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.22em;color:#8A7150;font-variant-numeric:tabular-nums;margin:0}'+
    '.sg-grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:8;background-image:url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'160\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'2\'/></filter><rect width=\'160\' height=\'160\' filter=\'url(%23n)\' opacity=\'0.8\'/></svg>")}'+
    '.sg-vignette{position:absolute;inset:0;pointer-events:none;z-index:7;background:radial-gradient(112% 96% at 50% 46%,transparent 54%,rgba(8,5,3,.8) 100%)}'+
    '@media (max-width:380px){.sg-frame{width:168px;height:126px}.sg-belt{height:170px}}'+
    '</style>'+
    '<div class="sg-stage">'+
      '<header class="sg-hd"><p class="sg-meta">1962 — 2026 · 一个家庭的相册</p><h1>拾光<span>家的记忆馆</span></h1></header>'+
      '<div class="sg-belt"><div class="sg-holes sg-top"></div><div class="sg-holes sg-bot"></div>'+
        '<div class="sg-halo"></div><div class="sg-track" id="sgTrack"></div>'+
        '<div class="sg-gate"><div class="sg-slit"></div></div></div>'+
      '<div class="sg-ft"><p class="sg-tip" id="sgTip">旧照片正在通过灯箱</p>'+
        '<div class="sg-pgw"><i id="sgPg"></i></div><p class="sg-pct" id="sgPct">0%</p></div>'+
      '<div class="sg-vignette"></div><div class="sg-grain"></div>'+
    '</div>';

  var track=root.getElementById('sgTrack'), belt=host,
      tip=root.getElementById('sgTip'), pg=root.getElementById('sgPg'),
      pctEl=root.getElementById('sgPct');

  var nodes=[], FW=196, GAP=16, STEP=0, TOTAL=0, SPEED=54;

  function build(){
    if(root.host && window.innerWidth<=380){ FW=168; }
    STEP=FW+GAP;
    TOTAL=SRC.length*STEP;
    var html='';
    for(var copy=0;copy<2;copy++){
      for(var i=0;i<SRC.length;i++){
        html+='<div class="sg-frame" data-x="'+(copy*SRC.length+i)*STEP+'">'+
              '<img class="sg-base" src="'+SRC[i]+'" alt="">'+
              '<img class="sg-clr" src="'+SRC[i]+'" alt="">'+
              '<i class="sg-yr">'+YEARS[i]+'</i></div>';
      }
    }
    track.innerHTML=html;
    var fr=track.querySelectorAll('.sg-frame');
    for(var k=0;k<fr.length;k++){
      nodes.push({el:fr[k], clr:fr[k].querySelector('.sg-clr'), x:parseFloat(fr[k].getAttribute('data-x'))});
    }
  }

  function clamp(v,a,b){return v<a?a:(v>b?b:v)}

  function renderAt(t){
    var tx=-(t*SPEED)%TOTAL;
    track.style.transform='translateX('+tx.toFixed(1)+'px)';
    var gateX=belt.clientWidth/2;
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      var L=n.x+tx;
      var cw=clamp(gateX-L,0,FW);
      n.clr.style.clipPath='inset(0 '+(FW-cw).toFixed(1)+'px 0 0)';
      n.el.style.setProperty('--hot',(Math.sin(Math.PI*clamp(cw/FW,0,1))*0.55).toFixed(2));
    }
    var prog=clamp(t/4.6,0,1);
    pg.style.width=(prog*100).toFixed(1)+'%';
    pctEl.textContent=(prog*100<10?'0':'')+Math.round(prog*100)+'%';
    tip.textContent = t<1.6 ? '旧照片正在通过灯箱'
                    : (t<3.4 ? '灯箱正在把颜色还给它' : '一张一张，慢慢都想起来了');
  }

  var t0=0;
  function tick(now){
    if(!t0) t0=now;
    renderAt((now-t0)/1000);
    requestAnimationFrame(tick);
  }

  function hide(){
    if(sessionStorage.getItem('sg_loader_shown')){ host.classList.add('hide'); return; }
    sessionStorage.setItem('sg_loader_shown','1');
    setTimeout(function(){ host.classList.add('hide'); }, 2600);
  }

  function start(){
    build();
    var m=location.search.match(/[?&]t=([\d.]+)/);
    if(m){ renderAt(parseFloat(m[1])); return; }
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ renderAt(4.6); return; }
    requestAnimationFrame(tick);
    if(document.readyState==='complete'){ hide(); }
    else window.addEventListener('load', hide);
  }

  if(document.readyState!=='loading') start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
</body>
</html>
