<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾光 · 加载等待（v4 影像版）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:
      radial-gradient(70% 55% at 68% 20%,rgba(214,150,58,.14),transparent 60%),
      radial-gradient(120% 90% at 50% 40%,#291f16 0%,#1B140e 52%,#110c08 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"KaiTi","STKaiti","楷体",serif;-webkit-font-smoothing:antialiased}

  .stage{position:relative;width:min(92vw,520px);height:min(88vh,680px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    perspective:1100px;perspective-origin:50% 42%}
  .camera{position:relative;transform-style:preserve-3d;
    animation:push 13s ease-in-out infinite alternate}
  @keyframes push{from{transform:translateZ(0) scale(1)}to{transform:translateZ(50px) scale(1.014)}}

  .bokeh{position:absolute;inset:-14%;pointer-events:none;transform:translateZ(-120px)}
  .bokeh i{position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(240,190,110,.5),rgba(240,190,110,0) 70%);
    filter:blur(9px);animation:drift 11s ease-in-out infinite alternate}
  .bokeh i:nth-child(1){width:120px;height:120px;left:6%;top:14%;opacity:.5}
  .bokeh i:nth-child(2){width:70px;height:70px;right:8%;top:6%;opacity:.38;animation-delay:-3s}
  .bokeh i:nth-child(3){width:150px;height:150px;right:-2%;bottom:4%;opacity:.3;animation-delay:-6s}
  .bokeh i:nth-child(4){width:56px;height:56px;left:16%;bottom:10%;opacity:.34;animation-delay:-8s}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(10px,-16px,0)}}

  .album{position:absolute;left:-1%;right:-1%;bottom:-36px;height:70px;border-radius:5px;
    background:linear-gradient(180deg,#6a4830,#432c1a 70%,#33200f);
    transform:translateZ(-70px) rotateX(7deg);
    box-shadow:0 30px 46px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,214,150,.18)}
  .album::before{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;border-radius:5px 0 0 5px;
    background:linear-gradient(90deg,#20140b,#7a5535 60%,#3a2412)}
  .album::after{content:"";position:absolute;right:5px;top:5px;bottom:5px;width:9px;border-radius:2px;
    background:repeating-linear-gradient(180deg,#e8dcc2 0 2px,#cbb995 2px 3px);opacity:.55}
  .glow{position:absolute;left:14%;right:14%;bottom:-46px;height:110px;
    background:radial-gradient(closest-side,rgba(214,150,58,.28),transparent);filter:blur(16px);
    transform:translateZ(-40px)}

  .photo{position:relative;width:min(78vw,410px);padding:11px 11px 30px;border-radius:2px;
    background:linear-gradient(160deg,#FDFAF3,#F3EBDC);
    transform-style:preserve-3d;
    transform:rotateY(-9deg) rotateX(6deg) rotateZ(-1.2deg);
    box-shadow:22px 26px 44px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.5);
    transition:transform .35s ease}
  .photo::after{content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.4),transparent 34%)}
  .win{position:relative;overflow:hidden;border-radius:1px;background:#2b2117;
    box-shadow:inset 0 0 24px rgba(40,26,10,.35)}
  .win img.ph{display:block;width:100%;height:auto}
  .win img.color{position:absolute;inset:0;height:100%;object-fit:cover;
    clip-path:inset(0 100% 0 0);animation:dev 3.9s linear .42s forwards}
  @keyframes dev{to{clip-path:inset(0 0 0 0)}}
  .beam{position:absolute;top:-6%;bottom:-6%;left:-13%;width:34%;pointer-events:none;mix-blend-mode:screen;
    background:
      linear-gradient(90deg,transparent 43%,rgba(255,252,232,.95) 50%,transparent 57%),
      linear-gradient(100deg,transparent 11%,rgba(255,226,168,.6) 50%,transparent 89%);
    filter:blur(3.2px);transform:translateX(0);
    animation:beamMove 3.9s linear .42s forwards}
  @keyframes beamMove{from{transform:translateX(0)}to{transform:translateX(285%)}}
  .note{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:12.5px;
    color:#8a6f4e;letter-spacing:.28em;text-indent:.28em}

  .fg{position:absolute;pointer-events:none}
  .fg-grass{left:-4%;bottom:-16%;width:40%;transform:translateZ(46px);
    filter:blur(2.6px);opacity:.85;animation:sway 7s ease-in-out infinite alternate}
  .fg-branch{right:-8%;top:-9%;width:32%;transform:translateZ(96px);
    filter:blur(3px);opacity:.8;animation:sway2 9s ease-in-out infinite alternate}
  @keyframes sway{from{transform:translateZ(46px) rotate(-1deg)}to{transform:translateZ(46px) rotate(1.6deg)}}
  @keyframes sway2{from{transform:translateZ(96px) rotate(1deg)}to{transform:translateZ(96px) rotate(-1.4deg)}}

  .dust{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
  .dust i{position:absolute;width:3px;height:3px;border-radius:50%;
    background:rgba(255,226,168,.85);animation:rise linear infinite}
  @keyframes rise{from{transform:translate3d(0,0,0);opacity:0}
    12%{opacity:.9}88%{opacity:.55}to{transform:translate3d(14px,-150px,0);opacity:0}}

  .copy{margin-top:34px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px}
  .story{font-size:13px;color:#B08A54;letter-spacing:.24em;text-indent:.24em;overflow:hidden}
  .story span{display:inline-block;transform:translateY(120%);
    animation:lineUp .9s cubic-bezier(.2,.7,.2,1) forwards}
  .story.s1 span{animation-delay:.35s}
  .story.s2 span{animation-delay:.85s}
  @keyframes lineUp{to{transform:translateY(0)}}
  .t1{font-size:20px;color:#F3E9D8;letter-spacing:.32em;text-indent:.32em;font-weight:700;
    margin-top:6px;overflow:hidden}
  .t1 span{display:inline-block;transform:translateY(130%);
    animation:lineUp .95s cubic-bezier(.2,.7,.2,1) 1.35s forwards}
  .bar{width:168px;height:2px;background:#3a2d1e;border-radius:2px;overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,#8a5a20,#EFCB92);
    animation:dev 3.9s linear .42s forwards}
  .t2{font-size:12.5px;color:#A08B6C;letter-spacing:.18em;overflow:hidden}
  .t2 span{display:inline-block;transform:translateY(120%);
    animation:lineUp .9s cubic-bezier(.2,.7,.2,1) 1.95s forwards}

  .grain{position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:5;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.75"/></svg>')}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(120% 100% at 50% 45%,transparent 55%,rgba(10,7,4,.62) 100%)}
  @media (prefers-reduced-motion:reduce){
    .camera,.bokeh i,.fg-grass,.fg-branch,.dust i{animation:none}
    .win img.color{animation:none;clip-path:inset(0 0 0 0)}
    .story span,.t1 span,.t2 span{animation:none;transform:none}
    .bar i{animation:none;transform:scaleX(1)}
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="camera">
    <div class="bokeh"><i></i><i></i><i></i><i></i></div>
    <div class="glow"></div>
    <div class="album"></div>

    <div class="photo" id="photo">
      <div class="win">
        <!-- 旧照（灰黄褪色） -->
        <img class="ph" src="{{OLD}}" alt="">
        <!-- 修复后（彩色，被显影揭开） -->
        <img class="ph color" src="{{NEW}}" alt="">
        <!-- 显影光带 -->
        <div class="beam"></div>


      </div>
      <div class="note">外婆家门口 · 一九七八</div>
    </div>

    <svg class="fg fg-grass" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <g fill="#241a10">
        <path d="M6,120 C10,86 18,70 26,56 C26,80 24,100 22,120 Z"/>
        <path d="M24,120 C30,92 42,74 52,62 C48,84 42,104 38,120 Z"/>
        <path d="M44,120 C50,96 60,82 72,72 C66,92 58,108 54,120 Z"/>
        <path d="M62,120 C68,102 74,92 84,84 C78,98 70,110 68,120 Z"/>
        <path d="M86,120 C90,104 96,96 104,90 C98,100 92,112 90,120 Z"/>
      </g>
    </svg>
    <svg class="fg fg-branch" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
      <path d="M200,10 C150,18 118,38 96,66" stroke="#241a10" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M148,22 C138,34 132,44 130,58" stroke="#241a10" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#c98f9c" opacity=".9">
        <circle cx="126" cy="60" r="13"/><circle cx="146" cy="42" r="10"/><circle cx="104" cy="72" r="11"/><circle cx="160" cy="30" r="8"/>
      </g>
    </svg>

    <div class="dust" id="dust"></div>
  </div>

  <div class="copy">
    <p class="story s1"><span>一九七八年 · 春</span></p>
    <p class="story s2"><span>外婆家门口，杏花开得正好</span></p>
    <p class="t1"><span>拾光 · 正在翻开这本相册</span></p>
    <div class="bar"><i></i></div>
    <p class="t2"><span>光扫过的地方，记忆慢慢有了颜色</span></p>
  </div>
</div>

<div class="vignette"></div>
<div class="grain"></div>

<script>
(function(){
  var dust=document.getElementById('dust'); if(!dust){return;}
  var spec=[[6,18,10,'0s'],[14,32,8,'-1s'],[22,58,14,'-3s'],[31,12,9,'-4.5s'],[39,74,16,'-2s'],
            [47,40,11,'-5.5s'],[55,24,7,'-6.5s'],[62,64,13,'-1.6s'],[70,44,10,'-3.8s'],
            [78,30,15,'-5s'],[86,68,9,'-0.8s'],[93,20,12,'-4.2s']];
  for(var i=0;i<spec.length;i++){
    var s=spec[i], el=document.createElement('i');
    var size=(i%3===0)?4:3, blur=(s[2]>50)?2.4:((s[2]>30)?1.2:0);
    el.style.left=s[0]+'%'; el.style.top=(s[1]+30)+'%';
    el.style.width=size+'px'; el.style.height=size+'px';
    el.style.filter='blur('+blur+'px)';
    el.style.opacity=blur?0.55:0.85;
    el.style.animationDuration=s[2]+'s';
    el.style.animationDelay=s[3];
    el.style.transform='translateZ('+(10+(i%4)*18)+'px)';
    dust.appendChild(el);
  }
})();

(function(){
  var st=document.getElementById('stage'), ph=document.getElementById('photo');
  if(!st||!ph) return;
  if(window.matchMedia&&matchMedia('(hover:none)').matches) return;
  st.addEventListener('mousemove',function(e){
    var r=st.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    ph.style.transform='rotateY('+(-9+x*10).toFixed(2)+'deg) rotateX('+(6-y*8).toFixed(2)+'deg) rotateZ(-1.2deg)';
  });
  st.addEventListener('mouseleave',function(){
    ph.style.transform='rotateY(-9deg) rotateX(6deg) rotateZ(-1.2deg)';
  });
})();
</script>
</body>
</html>
