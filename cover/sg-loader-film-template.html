<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾光 · 加载（胶片灯箱版）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:
      radial-gradient(60% 44% at 50% 46%,rgba(255,196,120,.10),transparent 66%),
      radial-gradient(110% 90% at 50% 44%,#1a1309 0%,#100b06 58%,#080503 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:var(--serif,"Noto Serif SC"),"Songti SC","STSong",serif;
    -webkit-font-smoothing:antialiased}

  .stage{position:relative;width:min(92vw,440px);height:min(86vh,680px);overflow:hidden}

  /* 灯箱光带 */
  .gate{position:absolute;left:50%;top:50%;width:230px;height:132px;
    transform:translate(-50%,-50%);pointer-events:none;z-index:3;
    background:radial-gradient(58% 100% at 50% 50%,rgba(255,206,146,.20),transparent 72%);
    box-shadow:inset 0 0 60px rgba(255,196,130,.14)}
  .gate::before,.gate::after{content:"";position:absolute;left:-20px;right:-20px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,206,150,.5),transparent)}
  .gate::before{top:0}
  .gate::after{bottom:0}

  /* 胶片带 */
  .stripWrap{position:absolute;left:50%;top:0;width:152px;height:100%;margin-left:-76px;z-index:1}
  .strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
  .strip.neg{filter:invert(1) brightness(.44) contrast(1.22) sepia(.15) saturate(.75)}
  .strip.neg .frame::after{content:"";position:absolute;inset:0;
    background:linear-gradient(rgba(34,18,5,.4),rgba(34,18,5,.4))}
  .strip.neg .no{color:#4fd2ff}
  .stripWrap.posw{clip-path:inset(calc(50% - 58px) 0 calc(50% - 58px) 0)}
  .strip.pos .frame img{filter:saturate(1.32) contrast(1.08) brightness(1.05)}

  .frame{position:relative;width:152px;height:101px;margin-bottom:24px;
    background:#0a0704;overflow:hidden;box-shadow:0 0 0 1px rgba(255,220,170,.10)}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .frame .no{position:absolute;left:5px;bottom:2px;font-family:ui-monospace,Menlo,monospace;
    font-size:8px;letter-spacing:.1em;color:rgba(255,232,196,.75)}

  /* 齿孔（挂在胶片带上，随片滚动） */
  .strip .holes{position:absolute;top:0;bottom:0;width:13px;z-index:2;
    background:repeating-linear-gradient(180deg,
      transparent 0 9px,rgba(6,4,2,.95) 9px 21px,transparent 21px 30px)}
  .strip .holes.l{left:-13px}
  .strip .holes.r{right:-13px}

  /* 文案 */
  .meta{position:absolute;left:2px;top:14px;z-index:4;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;
    letter-spacing:.2em;color:rgba(214,180,134,.5);text-transform:uppercase}
  .pct{position:absolute;right:2px;top:11px;z-index:4;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    letter-spacing:.12em;color:rgba(230,196,148,.72);font-variant-numeric:tabular-nums}

  .cap{position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:4}
  .cap b{display:block;font-size:27px;font-weight:700;letter-spacing:.42em;text-indent:.42em;
    color:#F4EADA;opacity:0;transform:translateY(6px);
    transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
  .cap em{display:block;margin-top:9px;font-style:normal;font-family:ui-monospace,Menlo,monospace;
    font-size:9.5px;letter-spacing:.26em;color:#94795A;opacity:0;transition:opacity 1s ease .25s}
  .cap.on b{opacity:1;transform:translateY(0)}
  .cap.on em{opacity:1}

  .cap b{text-shadow:0 2px 18px rgba(8,5,2,.9)}
  .stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:170px;z-index:2;
    background:linear-gradient(transparent,rgba(9,6,3,.94))}

  .grain{position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:5;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="160" height="160" filter="url(%23n)" opacity="0.8"/></svg>')}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(110% 96% at 50% 46%,transparent 52%,rgba(8,5,3,.82) 100%)}
  @media (prefers-reduced-motion:reduce){.cap b,.cap em{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stripWrap" id="wrap_neg"><div class="strip neg" id="neg"></div></div>
  <div class="stripWrap posw"><div class="strip pos" id="pos"></div></div>
  <div class="gate"></div>
  <div class="meta">Kodak · 35mm · 记忆胶卷</div>
  <div class="pct" id="pct">00%</div>
  <div class="cap" id="cap"><b>拾光</b><em>家的记忆馆 · 正在过灯箱</em></div>
</div>
<div class="vignette"></div>
<div class="grain"></div>

<script>
(function(){
  var A='{{OLD}}', B='{{NEW}}';
  var nums=['1978','1983','1989','1994','2001','2008','2015','2022'];
  var neg=document.getElementById('neg'), pos=document.getElementById('pos'),
      pctEl=document.getElementById('pct'), cap=document.getElementById('cap'),
      stage=document.getElementById('stage');
  var FH=125, COUNT=nums.length, H=0;

  function build(){
    var holes='<div class="holes l"></div><div class="holes r"></div>';
    var html='';
    for(var i=0;i<COUNT;i++){
      var src=(i%3===2)?A:B;
      html+='<div class="frame"><img src="'+src+'" style="transform:scale('+(1.02+(i%3)*0.05)+
            ')" alt=""><i class="no">'+nums[i]+'</i></div>';
    }
    /* 两遍，便于无缝滚动 */
    neg.innerHTML=holes+html+html;
    pos.innerHTML=html+html;
    H=COUNT*FH;
  }

  function renderAt(t){
    var y=-(t*58)%H;
    neg.style.transform='translateY('+y+'px)';
    pos.style.transform='translateY('+y+'px)';
    var p=Math.min(100,Math.round(t/4.2*100));
    pctEl.textContent=(p<10?'0':'')+p+'%';
    if(t>2.2) cap.classList.add('on');
  }

  var t0=0;
  function tick(now){
    if(!t0) t0=now;
    renderAt((now-t0)/1000);
    requestAnimationFrame(tick);
  }

  function start(){
    build();
    var m=location.search.match(/[?&]t=([\d.]+)/);
    if(m){ renderAt(parseFloat(m[1])); return; }
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
      renderAt(4.2); return;
    }
    requestAnimationFrame(tick);
  }

  var img=new Image();
  img.onload=start; img.onerror=start; img.src=B;
})();
</script>
</body>
</html>
